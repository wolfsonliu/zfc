[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zfc"
dynamic = ["version"]
description = "Calculate z-scored log2 fold change for pooled CRISPR screening count data."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Zhiheng Liu", email = "zhiheng.liu@pku.edu.cn" }]
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "scikit-learn"]

[project.scripts]
zfc = "zfc.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/zfc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zfc"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
